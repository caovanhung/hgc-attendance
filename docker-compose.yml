services:
  attendance-app:
    build: .
    container_name: hanet-attendance-app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TRUST_PROXY=1
      # - ADMIN_INITIAL_PASSWORD=doi-ngay-sau-khi-dang-nhap
    volumes:
      - attendance-data:/app/data

volumes:
  attendance-data:
    driver: local
